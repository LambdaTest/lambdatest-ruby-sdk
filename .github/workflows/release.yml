name: Release gem

on:
  workflow_dispatch:
    inputs:
      gem:
        description: 'Gem to publish'
        required: true
        type: choice
        options:
          - lambdatest-selenium-driver
          - lambdatest-sdk-utils
        default: lambdatest-selenium-driver

permissions:
  contents: read

concurrency:
  group: rubygems-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.gem }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: '3.3'

      - name: Build gem
        id: build
        run: |
          gem build "${{ inputs.gem }}.gemspec"
          file=$(ls ${{ inputs.gem }}-*.gem)
          version=${file#${{ inputs.gem }}-}; version=${version%.gem}
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The gemspec lists files with `git ls-files`; outside a git checkout it silently builds an empty gem
          gem spec "$file" files | grep -q '^- lib/' || { echo "::error::$file has no lib/ files"; exit 1; }
          gem spec "$file" files

      - name: Refuse an already published version
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://rubygems.org/api/v2/rubygems/${{ inputs.gem }}/versions/${{ steps.build.outputs.version }}.json")
          if [ "$code" = "200" ]; then
            echo "::error::${{ inputs.gem }} ${{ steps.build.outputs.version }} is already on RubyGems; bump its version.rb"
            exit 1
          fi

      # Installs the built file; its dependencies (lambdatest-sdk-utils for the driver) come from RubyGems
      - name: Smoke-load the built gem
        run: |
          gem install "${{ steps.build.outputs.file }}"
          case "${{ inputs.gem }}" in
            lambdatest-sdk-utils) lib=lambdatest/sdk/utils ;;
            *) lib=lambdatest/selenium/driver ;;
          esac
          ruby -e "require '$lib'; puts 'loaded $lib'"

      - name: Push to RubyGems
        run: gem push "${{ steps.build.outputs.file }}"
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}

      - name: Summary
        run: |
          echo "### ${{ inputs.gem }} ${{ steps.build.outputs.version }} pushed: https://rubygems.org/gems/${{ inputs.gem }}" >> "$GITHUB_STEP_SUMMARY"
